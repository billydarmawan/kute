name: Release
on:
  push:
    tags: ["v*"]
# id-token is what makes the cosign signatures keyless: the job trades this
# token for a short-lived Fulcio certificate naming this workflow and this
# tag, which is the identity `cosign verify-blob --certificate-identity`
# checks against. attestations is for the provenance step below.
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A tag publishes from whatever commit it points at, and nothing else
  # requires that commit to have passed CI (ci.yml runs on main pushes and
  # PRs, not tags). Gate the release on the same vet + test CI runs, so a
  # red commit can't ship.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cosign and syft come from here: .goreleaser.yaml's signs/sboms shell
      # out to both by name, and mise puts them on PATH for later steps.
      # MISE_ENV=release is what pulls mise.release.toml's tools in on top
      # of mise.toml's — see that file for why they're split out.
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        env:
          MISE_ENV: release
      - name: Generate changelog.json
        run: scripts/release-notes.sh "${{ github.ref_name }}"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pinned because this step now signs things: an unpinned binary
          # decides how the artifacts are produced. Keep in step with
          # ci.yml's goreleaser-check job by hand.
          version: "2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
      # Both installers and the in-app update check follow GitHub's latest
      # stable release. Assert the metadata after publication so a config or
      # GoReleaser regression cannot silently put a beta on that channel.
      - name: Verify the release channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF_NAME}" in
            *-*) expected=prerelease ;;
            *) expected=stable ;;
          esac
          actual=$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease \
            --jq 'if .isPrerelease then "prerelease" else "stable" end')
          if [ "${actual}" != "${expected}" ]; then
            echo "release channel mismatch: ${GITHUB_REF_NAME} is ${actual}, expected ${expected}" >&2
            exit 1
          fi
      # The signing step only runs on a tag — no PR has an OIDC identity, so
      # ci.yml's snapshot build passes `--skip=sign` and cannot catch a
      # cosign invocation that no longer parses. Verifying one archive here,
      # with the exact command docs/verifying-releases.md gives users, is
      # what turns that class of breakage into a red release job instead of
      # a release whose signatures nobody can check.
      - name: Verify the signatures we just published
        run: |
          set -euo pipefail
          for file in dist/kute_*_linux_amd64.tar.gz dist/checksums.txt; do
            echo "verifying ${file}"
            cosign verify-blob \
              --certificate-identity-regexp '^https://github\.com/kute-dev/kute/\.github/workflows/release\.yml@refs/tags/' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              --bundle "${file}.sigstore.json" \
              "${file}"
          done
      # One attestation over every file checksums.txt lists, so a user can
      # ask GitHub what built an archive (`gh attestation verify`) as well as
      # asking the signature who signed it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
