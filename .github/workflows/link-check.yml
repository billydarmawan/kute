name: Link check
# Deliberately not part of CI. Internal links are covered by a real test
# (cmd/site's TestGeneratedSiteLinksResolve) which is fast, offline and
# deterministic; this only follows the handful of links that leave the site,
# where a failure usually means somebody else moved a page rather than that
# this pull request is wrong. Blocking review on that would be flaky, so it
# runs weekly and on demand instead.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: link-check
  cancel-in-progress: true
jobs:
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Render the site
        run: go run ./cmd/site
      - name: Follow every outbound link
        run: |
          set -uo pipefail
          # Anchors and embedded resources only. rel=preconnect points at an
          # origin rather than a document, so those <link> hints answer 404
          # by design and must not be treated as breakage.
          grep -oh '<a [^>]*href="https\?://[^"]*"\|src="https\?://[^"]*"' website/dist/*.html \
            | grep -o 'https\?://[^"]*' \
            | sort -u > urls.txt
          echo "checking $(wc -l < urls.txt) outbound links"
          fail=0
          while read -r url; do
            code=$(curl -sSL --max-time 25 --retry 2 --retry-delay 3 \
              -o /dev/null -w '%{http_code}' \
              -A 'kute-link-check (+https://kute.dev)' "$url" || echo 000)
            case "$code" in
              2*|3*) printf '  ok   %s  %s\n' "$code" "$url" ;;
              # Some sites answer 403 to anything that is obviously a bot but
              # serve the page fine in a browser; loud, but not a failure.
              403|429) printf '  warn %s  %s\n' "$code" "$url" ;;
              *) printf '  FAIL %s  %s\n' "$code" "$url"; fail=1 ;;
            esac
          done < urls.txt
          exit $fail
