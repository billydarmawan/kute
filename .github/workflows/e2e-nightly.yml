# The legs of the end-to-end suite that are worth running but not worth
# paying for on every pull request: the second Kubernetes version, and the
# 5k-pod scale run. CI's own e2e job covers 1.35 on kind per PR, which keeps
# PR latency to a single cluster spin-up.
name: E2E nightly
on:
  schedule:
    # 03:20 UTC, off the hour to avoid the GitHub-wide cron pile-up.
    - cron: "20 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  kind:
    name: e2e (kind, k8s ${{ matrix.k8s }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 1.35 runs on every PR too; repeating it here catches the failures
        # that only show up against a cold cluster on a fresh runner.
        k8s: ["1.35", "1.36"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Create the cluster and apply fixtures
        env:
          K8S_VERSION: ${{ matrix.k8s }}
        run: scripts/e2e-cluster.sh up
      - name: Run the end-to-end suite
        run: go test -tags e2e -count=1 -timeout 15m ./test/e2e/... ./internal/kube/...
      - name: Collect the cluster's state on failure
        if: failure()
        run: |
          export KUBECONFIG="${GITHUB_WORKSPACE}/.kube/e2e.config"
          mkdir -p e2e-artifacts
          kubectl get all -n kute-e2e -o wide > e2e-artifacts/resources.txt 2>&1 || true
          kubectl describe pods -n kute-e2e > e2e-artifacts/pods.txt 2>&1 || true
          kubectl get events -n kute-e2e --sort-by=.lastTimestamp > e2e-artifacts/events.txt 2>&1 || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts-${{ matrix.k8s }}
          path: e2e-artifacts/
          if-no-files-found: ignore

  scale:
    name: e2e scale (kwok, 5k pods)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      # kwok, not kind: 5k pods on fake nodes is a size kind cannot reach on
      # a runner, and connect time and informer heap are what this measures.
      - name: Create the scale cluster
        run: scripts/e2e-scale-cluster.sh up
      - name: Run the scale suite
        env:
          KUTE_E2E_SCALE_NAV_ITERATIONS: "8"
          KUTE_E2E_SCALE_BURST_PODS: "500"
        run: go test -tags "e2e e2e_scale" -count=1 -timeout 30m -run TestScale ./test/e2e/...

  soak:
    name: e2e soak (kind, k8s 1.36)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Create the cluster and apply fixtures
        env:
          K8S_VERSION: "1.36"
        run: scripts/e2e-cluster.sh up
      - name: Run the bounded long-session suite
        run: go test -tags "e2e e2e_soak" -count=1 -timeout 25m -run 'Test(EventStorm|RepeatedWorkflowSoak|HighRateLogs|NamespaceFanOut)' ./test/e2e/...
      - name: Collect the cluster's state on failure
        if: failure()
        run: |
          export KUBECONFIG="${GITHUB_WORKSPACE}/.kube/e2e.config"
          mkdir -p e2e-soak-artifacts
          kubectl get all -A -o wide > e2e-soak-artifacts/resources.txt 2>&1 || true
          kubectl describe pods -n kute-e2e > e2e-soak-artifacts/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > e2e-soak-artifacts/events.txt 2>&1 || true
      - name: Upload soak failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-soak-artifacts
          path: e2e-soak-artifacts/
          if-no-files-found: ignore

  auth-pty:
    name: e2e authentication and PTY (kind, k8s 1.36)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Create the cluster and apply fixtures
        env:
          K8S_VERSION: "1.36"
        run: scripts/e2e-cluster.sh up
      - name: Run authentication expiry and PTY handoff suites
        run: >-
          go test -tags "e2e e2e_auth e2e_pty" -count=1 -timeout 15m
          -run 'Test(DirectUnauthorizedPausesHealthChecks|ExecCredentialExpiryRecoversWithoutRestart|PTYExecSubprocessHandoff)$'
          ./test/e2e/...
      - name: Collect the cluster's state on failure
        if: failure()
        run: |
          export KUBECONFIG="${GITHUB_WORKSPACE}/.kube/e2e.config"
          mkdir -p e2e-auth-pty-artifacts
          kubectl get all -A -o wide > e2e-auth-pty-artifacts/resources.txt 2>&1 || true
          kubectl describe pods -n kute-e2e > e2e-auth-pty-artifacts/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > e2e-auth-pty-artifacts/events.txt 2>&1 || true
      - name: Upload authentication and PTY failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-auth-pty-artifacts
          path: e2e-auth-pty-artifacts/
          if-no-files-found: ignore
