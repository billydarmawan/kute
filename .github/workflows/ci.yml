name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Verify module files
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: golangci-lint run
      # Also runs weekly on a cron (govulncheck.yml), which is what catches a
      # vulnerability newly disclosed against code nobody touched. This copy
      # is the gate: without it a PR introducing a vulnerable dependency
      # merges clean and is only caught up to seven days later.
      - name: govulncheck
        run: govulncheck ./...
      # deploy-pages.yml renders the site on push to main, where a broken
      # template would fail after review rather than during it.
      - name: Render the website
        run: go run ./cmd/site
      # betamax parses the tapes but records nothing, so this is cheap and
      # needs no fonts or terminal. Recording is manual and local, which means
      # a tape broken by an edit would otherwise stay broken until the next
      # time someone regenerated the media.
      - name: Validate the recording tapes
        run: betamax validate 'docs/assets/tapes/*.tape'
      - name: go test
        run: go test -race -shuffle=on -count=1 ./...
  # The release builds a windows/amd64 and windows/arm64 binary, so something
  # has to actually run one. mise rather than setup-go everywhere else, but
  # its Windows coverage for kubectl/golangci-lint is the weak link and none
  # of that is needed to compile and unit-test. The Go version is read out of
  # mise.toml rather than pinned again here — three different numbers in
  # go.mod, mise.toml and this file is exactly the drift that comment used to
  # ask a human to prevent.
  windows:
    name: build + test (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the pinned Go version
        id: goversion
        shell: bash
        run: |
          version=$(sed -n 's/^go[[:space:]]*=[[:space:]]*"\([^"]*\)"/\1/p' mise.toml | head -1)
          [ -n "$version" ] || { echo "no go version found in mise.toml" >&2; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.goversion.outputs.version }}
      - name: go build
        run: go build ./...
      # No -race: it needs cgo, and the Windows runners have no gcc.
      - name: go test
        run: go test -count=1 ./...

  e2e:
    name: e2e (kind, k8s 1.35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Create the cluster and apply fixtures
        run: scripts/e2e-cluster.sh up
      # ./internal/kube/... is in the same invocation because the
      # wire-level invariants live beside count_test.go — they need the
      # unexported kindInformers map, so they cannot live in test/e2e.
      - name: Run the end-to-end suite
        run: go test -tags e2e -count=1 -timeout 15m ./test/e2e/... ./internal/kube/...
      # The harness logs the last captured frame on failure, which is the
      # only diagnostic a headless TUI run leaves behind.
      - name: Collect the cluster's state on failure
        if: failure()
        run: |
          export KUBECONFIG="${GITHUB_WORKSPACE}/.kube/e2e.config"
          mkdir -p e2e-artifacts
          kubectl get all -n kute-e2e -o wide > e2e-artifacts/resources.txt 2>&1 || true
          kubectl describe pods -n kute-e2e > e2e-artifacts/pods.txt 2>&1 || true
          kubectl get events -n kute-e2e --sort-by=.lastTimestamp > e2e-artifacts/events.txt 2>&1 || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore

  goreleaser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # syft is what the snapshot sbom pipe below shells out to; cosign comes
      # along too even though signing is skipped (see below). MISE_ENV=release
      # pulls mise.release.toml's tools in on top of mise.toml's.
      - name: Setup mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        env:
          MISE_ENV: release
      - name: Run GoReleaser check
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Keep in step with release.yml's version by hand.
          version: "2.17.1"
          args: check
      # release.yml runs scripts/release-notes.sh only on a tag, so a change
      # to it, to cliff.toml or to git-cliff's --context output would
      # otherwise first fail (or ship a malformed changelog.json into 28b)
      # mid-release. Run the current script and config against the last
      # tag, checked out in a worktree since --current needs HEAD at a tag,
      # and check the shape tasks/update decodes.
      - name: Generate changelog.json for the last tag
        run: |
          set -euo pipefail
          tag=$(git describe --tags --abbrev=0)
          git worktree add --detach "${RUNNER_TEMP}/last-tag" "${tag}"
          (cd "${RUNNER_TEMP}/last-tag" && "${GITHUB_WORKSPACE}/scripts/release-notes.sh" "${tag}")
          jq -e 'type == "array" and all(.[]; (.type | IN("new", "fix", "perf")) and (.text | type == "string" and length > 0))' \
            .release/changelog.json
      # `check` validates the config's shape, not that the tools it shells
      # out to exist: syft missing from PATH renders identically until a tag
      # is pushed. A snapshot build runs the sbom pipe for real. Signing is
      # skipped because keyless cosign needs an OIDC identity no PR has, and
      # the tokens are dummies because the scoop/homebrew stanzas resolve
      # {{ .Env.* }} even on a run that publishes nothing.
      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "2.17.1"
          args: release --snapshot --clean --skip=publish,sign
        env:
          HOMEBREW_TAP_TOKEN: dummy
          SCOOP_BUCKET_TOKEN: dummy
      - name: Check the snapshot produced an SBOM per archive
        run: |
          archives=$(find dist -name 'kute_*.tar.gz' -o -name 'kute_*.zip' | wc -l)
          sboms=$(find dist -name '*.sbom.json' | wc -l)
          echo "archives=${archives} sboms=${sboms}"
          [ "$archives" -gt 0 ] && [ "$archives" -eq "$sboms" ]
